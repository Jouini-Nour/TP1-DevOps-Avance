apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

namespace: gitops-namespace

commonAnnotations:
  managed-by: argocd
  environment: dev

patches:
  - target:
      kind: Deployment
      name: nginx-deployment
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /metadata/annotations
        value:
          description: "Development overlay with 3 replicas"
